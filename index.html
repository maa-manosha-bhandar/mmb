<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maa Manosha Bhandar</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0b4d2c;--green-light:#e8f5ee;--green-mid:#1a7a46;
  --gold:#c8962a;--gold-light:#fdf6e3;
  --red:#c0392b;--red-light:#fff0ef;
  --bg:#f7f4ed;--card:#fff;--border:#e2ddd4;
  --text:#1a1a1a;--muted:#6b7280;
  --r:14px;--sh:0 2px 12px rgba(11,77,44,.10);--shl:0 8px 30px rgba(11,77,44,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto}

/* ── HEADER ── */
header{background:linear-gradient(135deg,var(--green) 0%,#1d6b40 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.18)}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.shop-name{font-family:'Tiro Devanagari Hindi',serif;font-size:19px;line-height:1.2}
.shop-sub{font-size:11px;opacity:.8;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}

/* ── TABS ── */
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);position:sticky;top:80px;z-index:99}
.tab{flex:1;padding:12px 8px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .2s;position:relative}
.tab.active{color:var(--green)}
.tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:3px;background:var(--green);border-radius:2px 2px 0 0}
.tab-icon{font-size:17px;display:block;margin-bottom:2px}
.tab-badge{display:inline-block;background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:50px;margin-left:4px;vertical-align:middle}

/* ── PANELS ── */
.panel{display:none;padding:14px;padding-bottom:80px}
.panel.active{display:block}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--border)}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px}

/* ── FORMS ── */
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:10px;letter-spacing:.3px}
input,select{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);background:#fafaf8;transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(11,77,44,.1);background:#fff}
input::placeholder{color:#b0a898}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ── BUTTONS ── */
button{border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn{background:var(--green);color:#fff;padding:13px 16px;border-radius:10px;width:100%;font-size:15px;font-weight:600;margin-top:12px;transition:background .2s,transform .1s}
.btn:hover{background:var(--green-mid)}.btn:active{transform:scale(.98)}
.btn-sm{background:var(--green);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;transition:background .2s}
.btn-sm:hover{background:var(--green-mid)}
.btn-outline{background:transparent;border:1.5px solid var(--green);color:var(--green);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;transition:all .2s}
.btn-outline:hover{background:var(--green-light)}
.btn-danger{background:var(--red-light);color:var(--red);border:1.5px solid #fecaca;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600}
.btn-ghost{background:none;color:var(--green);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600}

/* ── INVENTORY ── */
.inv-search{margin-bottom:12px}
.product{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:10px}
.product:last-child{border-bottom:none}
.product-name{font-weight:600;font-size:14px}
.product-meta{font-size:12px;color:var(--muted);margin-top:2px}
.product-price{font-weight:700;color:var(--green);font-size:14px;white-space:nowrap}
.product-actions{display:flex;gap:4px;flex-shrink:0}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty p{font-size:14px}

/* ── MIC AREA ── */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 12px}
.mic{width:76px;height:76px;border-radius:50%;font-size:28px;background:var(--green);color:#fff;box-shadow:0 4px 18px rgba(11,77,44,.3);transition:all .2s;display:flex;align-items:center;justify-content:center}
.mic:hover{transform:scale(1.05)}.mic.listening{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}70%{box-shadow:0 0 0 16px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
.mic-hint{font-size:12px;color:var(--muted);font-weight:500;text-align:center;line-height:1.5}
#heard{font-size:13px;color:var(--green);font-style:italic;min-height:18px;text-align:center;max-width:100%;word-break:break-word}

/* ── AUTO DETECT BADGE ── */
.auto-badge{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);border:1px solid #a3d4b6;border-radius:50px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--green);margin-bottom:10px}
.auto-badge.amount-mode{background:#fdf6e3;border-color:#e8c96a;color:var(--gold)}
.auto-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ── MODE TOGGLE ── */
.mode-toggle{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px;margin-bottom:12px}
.mode-btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);background:none;transition:all .2s}
.mode-btn.active{background:var(--card);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ── VOICE RESULT PANEL ── */
.voice-result{background:var(--green-light);border:1.5px solid #a3d4b6;border-radius:var(--r);padding:14px;margin-top:10px;display:none;animation:slideUp .2s ease}
.voice-result.show{display:block}
.vr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.vr-label{font-size:12px;font-weight:600;color:var(--muted)}
.vr-val{font-size:14px;font-weight:700;color:var(--green)}
.vr-change{background:none;color:var(--green);font-size:12px;font-weight:600;text-decoration:underline;padding:0}

/* ── MANUAL SECTION ── */
.manual-section{margin-top:12px;border-top:1.5px dashed var(--border);padding-top:12px}
.manual-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.manual-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.collapse-btn{background:none;color:var(--muted);font-size:12px;font-weight:600}

/* ── SUGGESTIONS ── */
.suggestions{border:1.5px solid var(--border);border-radius:10px;max-height:200px;overflow:auto;margin-top:8px;display:none;background:var(--card);box-shadow:var(--shl);position:relative;z-index:10}
.suggestions.show{display:block}
.s-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;display:flex;justify-content:space-between;align-items:center}
.s-item:last-child{border-bottom:none}
.s-item:hover,.s-item.hi{background:var(--green-light)}
.s-name{font-size:14px;font-weight:500}
.s-price{font-size:12px;color:var(--muted)}
.s-match{font-size:11px;color:var(--green);font-weight:600}

/* ── SELECTED CHIP ── */
.sel-chip{display:flex;align-items:center;justify-content:space-between;background:var(--green-light);border:1.5px solid #a3d4b6;border-radius:10px;padding:10px 14px;margin-top:10px;display:none}
.sel-chip.show{display:flex}
.sel-chip-text{font-size:13px;font-weight:600;color:var(--green)}
.sel-chip-clear{background:none;color:var(--muted);font-size:20px;padding:0;line-height:1}

/* ── RESULT CARD ── */
#result{margin-top:12px}
.result-card{background:var(--gold-light);border:1.5px solid #e8c96a;border-radius:var(--r);padding:16px;text-align:center;animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result-name{font-size:13px;font-weight:600;color:var(--muted)}
.result-amount{font-size:40px;font-weight:700;color:var(--green);line-height:1.1}
.result-sub{font-size:13px;color:var(--muted);margin:4px 0 12px}

/* ── BILL ── */
.bill-header{text-align:center;padding-bottom:14px;border-bottom:2px dashed var(--border);margin-bottom:12px}
.bill-shop{font-family:'Tiro Devanagari Hindi',serif;font-size:21px}
.bill-shop-sub{font-size:11px;color:var(--muted);margin-top:2px}
.bill-date{font-size:11px;color:var(--muted);margin-top:5px}
.bill-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border);gap:8px}
.bill-item:last-child{border-bottom:none}
.bill-item-name{font-weight:600;font-size:14px}
.bill-item-qty{font-size:11px;color:var(--muted);margin-top:2px}
.bill-item-price{font-weight:700;font-size:14px;color:var(--green);white-space:nowrap}
.grand-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;border-top:2px solid var(--green);margin-top:8px}
.grand-label{font-size:16px;font-weight:700}
.grand-amount{font-size:30px;font-weight:700;color:var(--green)}
.bill-empty{text-align:center;padding:22px;color:var(--muted);font-size:14px}
.bill-actions{display:flex;gap:10px;margin-top:12px}
.bill-actions .btn{margin-top:0;flex:1}
.btn-clear{background:var(--red-light);color:var(--red);border:1.5px solid #fecaca}
.btn-clear:hover{background:#fee2e2}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;color:#fff;padding:11px 20px;border-radius:50px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s ease;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.25)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green)}
#toast.error{background:var(--red)}
#toast.info{background:#1d4ed8}

/* ── INVENTORY SEARCH ── */
#invSearch{margin-bottom:0}

/* ── PRINT ── */
@media print{
  .no-print{display:none!important}
  body{background:#fff;max-width:100%}
  .card{box-shadow:none;border:none;padding:0}
  header,.tabs,#toast,.panel:not(#billing){display:none}
  #billing{display:block!important;padding:0}
  .billing-control{display:none}
}

/* ── INVENTORY FILTER TAGS ── */
.filter-tags{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.filter-tags::-webkit-scrollbar{display:none}
.ftag{padding:5px 12px;border-radius:50px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s}
.ftag.active{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>
<body>

<header class="no-print">
  <div class="logo">🛒</div>
  <div>
    <div class="shop-name">Maa Manosha Bhandar</div>
    <div class="shop-sub">Smart Grocery Billing</div>
  </div>
</header>

<div class="tabs no-print">
  <button id="iTab" class="tab active" onclick="openTab('inventory','iTab')">
    <span class="tab-icon">📦</span>Inventory
  </button>
  <button id="bTab" class="tab" onclick="openTab('billing','bTab')">
    <span class="tab-icon">🧾</span>Billing
    <span id="billBadge" class="tab-badge" style="display:none">0</span>
  </button>
</div>

<!-- ═══════ INVENTORY TAB ═══════ -->
<div id="inventory" class="panel active">

  <div class="card">
    <div class="card-title" id="formTitle">Add New Product</div>
    <label for="pname">Product Name</label>
    <input id="pname" placeholder="e.g. Mustard Oil" autocomplete="off">
    <label for="palias">Aliases (comma-separated)</label>
    <input id="palias" placeholder="e.g. sorser tel, mustard">
    <div class="row">
      <div>
        <label for="punit">Unit</label>
        <select id="punit">
          <option>kg</option><option>gm</option><option>piece</option>
          <option>pack</option><option>dozen</option><option>tray</option>
          <option>ml</option><option>litre</option><option>mg</option>
        </select>
      </div>
      <div>
        <label for="pbaseqty">Base Qty</label>
        <input id="pbaseqty" type="number" value="1" min="0.001" step="any">
      </div>
    </div>
    <label for="pprice">Price (₹)</label>
    <input id="pprice" type="number" placeholder="e.g. 175" min="0" step="any">
    <input type="hidden" id="editIndex" value="-1">
    <button class="btn" onclick="saveProduct()">💾 Save Product</button>
    <button class="btn-outline" id="cancelEdit" style="display:none;margin-top:8px;width:100%" onclick="cancelEditFn()">✕ Cancel Edit</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="card-title" style="margin-bottom:0">Products <span id="productCount" style="color:var(--green)"></span></div>
    </div>
    <input id="invSearch" class="inv-search" placeholder="🔍 Filter inventory…" oninput="filterInventory()" autocomplete="off">
    <div id="filterTags" class="filter-tags" style="margin-top:8px"></div>
    <div id="inventoryList"></div>
  </div>
</div>

<!-- ═══════ BILLING TAB ═══════ -->
<div id="billing" class="panel">

  <!-- VOICE + SMART MODE CARD -->
  <div class="card no-print billing-control">
    <div class="mic-wrap">
      <button class="mic" id="micBtn" onclick="startVoice()">🎤</button>
      <div class="mic-hint">
        Tap &amp; say: <em>"10 taka r chal"</em> or <em>"500 gm maida"</em>
      </div>
      <div id="heard"></div>
    </div>

    <!-- AUTO-DETECT STATUS -->
    <div id="autoBadge" class="auto-badge" style="display:none">
      <span class="dot"></span><span id="autoBadgeText">Auto: Qty mode</span>
      <button onclick="toggleManual()" style="background:none;font-size:11px;font-weight:700;color:inherit;text-decoration:underline;padding:0;margin-left:4px">Change</button>
    </div>

    <!-- VOICE RESULT PANEL (shows detected item + values) -->
    <div class="voice-result" id="voiceResult">
      <div class="vr-row">
        <span class="vr-label">Detected Item</span>
        <span class="vr-val" id="vr-item">—</span>
      </div>
      <div class="vr-row">
        <span class="vr-label">Mode</span>
        <span class="vr-val" id="vr-mode">—</span>
      </div>
      <div class="vr-row" id="vr-qty-row">
        <span class="vr-label">Quantity</span>
        <span class="vr-val" id="vr-qty">—</span>
      </div>
    </div>

    <!-- MANUAL OVERRIDE SECTION -->
    <div class="manual-section" id="manualSection">
      <div class="manual-header">
        <div class="manual-title">Manual Override</div>
      </div>

      <!-- MODE TOGGLE -->
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeQtyBtn" onclick="setMode('qty')">📏 By Qty</button>
        <button class="mode-btn" id="modeAmtBtn" onclick="setMode('amount')">💰 By Amount</button>
      </div>

      <!-- QTY FIELDS -->
      <div id="qtyFields">
        <div class="row">
          <div>
            <label for="qty">Quantity</label>
            <input id="qty" type="number" placeholder="e.g. 2" min="0" step="any">
          </div>
          <div>
            <label for="unit">Unit</label>
            <select id="unit">
              <option>kg</option><option>gm</option><option>piece</option>
              <option>pack</option><option>dozen</option><option>tray</option>
              <option>ml</option><option>litre</option>
            </select>
          </div>
        </div>
      </div>

      <!-- AMOUNT FIELD -->
      <div id="amtFields" style="display:none">
        <label for="amountInput">Amount (₹)</label>
        <input id="amountInput" type="number" placeholder="e.g. 50" min="0" step="any">
      </div>

      <!-- SEARCH -->
      <label for="search">Search / Change Item</label>
      <input id="search" placeholder="Type to search product…" oninput="searchItems()" autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>

    <!-- SELECTED CHIP -->
    <div class="sel-chip" id="selChip">
      <span class="sel-chip-text" id="selChipText"></span>
      <button class="sel-chip-clear" onclick="clearSelected()">×</button>
    </div>

    <button class="btn" onclick="calculate()">⚡ Calculate &amp; Add to Bill</button>
    <div id="result"></div>
  </div>

  <!-- BILL PRINTOUT CARD -->
  <div class="card" id="billCard">
    <div class="bill-header">
      <div class="bill-shop">Maa Manosha Bhandar</div>
      <div class="bill-shop-sub">Quality Grocery · Baharampur</div>
      <div class="bill-date" id="billDate"></div>
    </div>
    <div id="billList"></div>
    <div id="grandRow" style="display:none">
      <div class="grand-row">
        <div class="grand-label">Total</div>
        <div class="grand-amount" id="grand">₹0</div>
      </div>
    </div>
    <div class="bill-actions no-print" id="billActions" style="display:none">
      <button class="btn btn-clear" onclick="clearBill()">🗑 Clear</button>
      <button class="btn" onclick="window.print()">🖨 Print</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

// ════════════════════════════════════════════

  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById(btn).classList.add('active');
}

// ════════════════════════════════════════════
//  MODE
// ════════════════════════════════════════════
function setMode(m, auto=false){
  mode=m;
  document.getElementById('modeQtyBtn').classList.toggle('active',m==='qty');
  document.getElementById('modeAmtBtn').classList.toggle('active',m==='amount');
  document.getElementById('qtyFields').style.display=m==='qty'?'':'none';
  document.getElementById('amtFields').style.display=m==='amount'?'':'none';
  if(!auto){
    const ab=document.getElementById('autoBadge');
    ab.style.display='none'; // manual override hides auto badge
  }
}

function toggleManual(){
  manualOpen=!manualOpen;
  document.getElementById('manualSection').style.display=manualOpen?'block':'none';
}

// ════════════════════════════════════════════
//  INVENTORY RENDER
// ════════════════════════════════════════════
function buildCatTags(){
  const cats = [...new Set(products.map(p=>p.cat||'misc'))];
  const tags = document.getElementById('filterTags');
  tags.innerHTML = `<button class="ftag active" onclick="setCatFilter('all')">All</button>` +
    cats.map(c=>`<button class="ftag" onclick="setCatFilter('${c}')">${CATS[c]||c}</button>`).join('');
}

function setCatFilter(cat){
  invCatFilter=cat;
  document.querySelectorAll('.ftag').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim()==='All'? cat==='all': b.onclick.toString().includes(`'${cat}'`));
  });
  renderInventory();
}

function filterInventory(){
  invFilter=document.getElementById('invSearch').value.toLowerCase();
  renderInventory();
}

function renderInventory(){
  const list=document.getElementById('inventoryList');
  let filtered=products.filter((p,i)=>{
    const matchCat = invCatFilter==='all' || (p.cat||'misc')===invCatFilter;
    const matchText = !invFilter ||
      p.name.toLowerCase().includes(invFilter) ||
      (p.aliases||[]).some(a=>a.toLowerCase().includes(invFilter));
    return matchCat && matchText;
  });
  document.getElementById('productCount').textContent='('+products.length+')';
  if(!filtered.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>No matching products.</p></div>';
    return;
  }
  list.innerHTML=filtered.map(p=>{
    const i=products.indexOf(p);
    return `<div class="product">
      <div style="flex:1;min-width:0">
        <div class="product-name">${p.name}</div>
        <div class="product-meta">${p.baseQty}${p.unit} = ₹${p.price} · ${CATS[p.cat||'misc']||'Misc'}</div>
      </div>
      <div class="product-price">₹${p.price}</div>
      <div class="product-actions">
        <button class="btn-ghost" onclick="editProduct(${i})">✏️</button>
        <button class="btn-danger" onclick="deleteProduct(${i})">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════
//  SAVE / EDIT / DELETE PRODUCT
// ════════════════════════════════════════════
function saveProduct(){
  const idx=parseInt(document.getElementById('editIndex').value);
  const p={
    name:document.getElementById('pname').value.trim(),
    aliases:document.getElementById('palias').value.split(',').map(x=>x.trim()).filter(Boolean),
    unit:document.getElementById('punit').value,
    baseQty:parseFloat(document.getElementById('pbaseqty').value)||1,
    price:parseFloat(document.getElementById('pprice').value),
    cat:document.getElementById('pcat')?.value||'misc'
  };
  if(!p.name){showToast('Enter a product name','error');return;}
  if(!p.price||p.price<=0){showToast('Enter a valid price','error');return;}
  if(idx>=0){
    products[idx]=p; showToast('Product updated ✓');
  }else{
    if(products.find(x=>x.name.toLowerCase()===p.name.toLowerCase())){
      showToast('Product already exists!','error');return;
    }
    products.push(p); showToast('Product added ✓');
  }
  saveStore(); buildCatTags(); renderInventory(); clearForm();
}

function clearForm(){
  ['pname','palias','pprice'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pbaseqty').value='1';
  document.getElementById('editIndex').value='-1';
  document.getElementById('formTitle').textContent='Add New Product';
  document.getElementById('cancelEdit').style.display='none';
}
function cancelEditFn(){clearForm();}

function editProduct(i){
  const p=products[i];
  document.getElementById('pname').value=p.name;
  document.getElementById('palias').value=(p.aliases||[]).join(', ');
  document.getElementById('punit').value=p.unit;
  document.getElementById('pbaseqty').value=p.baseQty;
  document.getElementById('pprice').value=p.price;
  document.getElementById('editIndex').value=i;
  document.getElementById('formTitle').textContent='Edit: '+p.name;
  document.getElementById('cancelEdit').style.display='block';
  openTab('inventory','iTab');
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteProduct(i){
  if(!confirm(`Delete "${products[i].name}"?`))return;
  products.splice(i,1); saveStore(); buildCatTags(); renderInventory();
  showToast('Deleted');
}

// ════════════════════════════════════════════
//  SMART FUZZY SEARCH ENGINE
// ════════════════════════════════════════════
// Extended Bengali/Hindi → English normalisation map
const NORM_MAP = {
  // money words
  'taka':'rupees','tka':'rupees','rs':'rupees','tk':'rupees',
  // Bengali units
  'dim':'egg','deem':'egg','chal':'rice','chini':'sugar','loon':'salt','nun':'salt',
  'sorser tel':'mustard oil','sorse tel':'mustard oil','tel':'oil',
  'ata':'flour','atta':'flour','daal':'dal','dal':'dal',
  'aloo':'potato','alu':'potato',
  'halud':'turmeric','haldi':'turmeric',
  'morich':'chili','lonka':'chili','lal morich':'red chili',
  'cha':'tea','chai':'tea',
  'jire':'cumin','jera':'cumin','jira':'cumin','jeera':'cumin',
  'dhaniya':'coriander',
  'posto':'poppy','khus khus':'poppy',
  'elachi':'cardamom','elaichi':'cardamom',
  'lobongo':'clove','laung':'clove',
  'aam':'mango','lichu':'lychee',
  'badam':'almond','kaju':'cashew','kismish':'raisin',
  'chira':'flattened rice','chere':'flattened rice',
  'suji':'semolina','sooji':'semolina',
  'bason':'gram flour','besan':'gram flour',
  'jharna':'mustard','sorse':'mustard',
  'gur':'jaggery','gud':'jaggery',
  'piaz':'onion','pyaaz':'onion',
  'adrak':'ginger','roshun':'garlic',
  'noida':'maida',
};

function normalize(t){
  t = t.toLowerCase().trim();
  // apply map longest-first
  const keys = Object.keys(NORM_MAP).sort((a,b)=>b.length-a.length);
  for(const k of keys){ t=t.replaceAll(k, NORM_MAP[k]); }
  return t;
}

function scoreMatch(query, product){
  const qn = normalize(query);
  const pname = product.name.toLowerCase();
  const aliases = (product.aliases||[]).map(a=>a.toLowerCase());
  const all = [pname, ...aliases];

  let best = 0;
  for(const s of all){
    const sn = normalize(s);
    // exact match
    if(sn===qn || s===query.toLowerCase()) return 1.0;
    // starts with
    if(sn.startsWith(qn) || s.startsWith(query.toLowerCase())) best=Math.max(best,0.9);
    // contains
    if(sn.includes(qn) || s.includes(query.toLowerCase())) best=Math.max(best,0.8);
    // word overlap
    const qWords = qn.split(/\s+/).filter(w=>w.length>1);
    const sWords = sn.split(/\s+/);
    let hits=0;
    for(const w of qWords){ if(sWords.some(sw=>sw.includes(w)||w.includes(sw))) hits++; }
    if(qWords.length>0) best=Math.max(best, (hits/qWords.length)*0.75);
    // character coverage
    let cov=0;
    for(const c of qn){ if(sn.includes(c)) cov++; }
    best=Math.max(best, (cov/Math.max(qn.length,sn.length))*0.5);
  }
  return best;
}

function rankProducts(query, threshold=0.25){
  const results=[];
  for(const p of products){
    const score=scoreMatch(query,p);
    if(score>=threshold) results.push({p,score});
  }
  return results.sort((a,b)=>b.score-a.score);
}

// ════════════════════════════════════════════
//  SEARCH BAR (manual)
// ════════════════════════════════════════════
let _st;
function searchItems(){
  clearTimeout(_st); _st=setTimeout(_doSearch,100);
}
function _doSearch(){
  const q=document.getElementById('search').value.trim();
  const sugg=document.getElementById('suggestions');
  sugg.innerHTML=''; sugg.classList.remove('show');
  if(!q) return;
  const ranked=rankProducts(q,0.2).slice(0,6);
  if(!ranked.length) return;
  sugg.classList.add('show');
  ranked.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='s-item'+(i===0?' hi':'');
    d.innerHTML=`<div><div class="s-name">${r.p.name}</div></div>
      <div style="text-align:right"><div class="s-price">₹${r.p.price}/${r.p.baseQty}${r.p.unit}</div>
      <div class="s-match">${Math.round(r.score*100)}% match</div></div>`;
    d.onclick=()=>selectItem(r.p);
    sugg.appendChild(d);
  });
}

function selectItem(p){
  selectedItem=p;
  document.getElementById('search').value='';
  document.getElementById('suggestions').classList.remove('show');
  document.getElementById('suggestions').innerHTML='';
  updateChip();
  document.getElementById('result').innerHTML='';
}

function clearSelected(){
  selectedItem=null; updateChip();
  document.getElementById('result').innerHTML='';
}

function updateChip(){
  const chip=document.getElementById('selChip');
  const txt=document.getElementById('selChipText');
  if(selectedItem){
    chip.classList.add('show');
    txt.textContent=`🛍 ${selectedItem.name} · ₹${selectedItem.price}/${selectedItem.baseQty}${selectedItem.unit}`;
  }else{
    chip.classList.remove('show');
  }
}

// ════════════════════════════════════════════
//  VOICE RECOGNITION
// ════════════════════════════════════════════
function parseVoiceCommand(raw){
  const t = normalize(raw);
  const result = { raw, normalized: t, mode: 'qty', number: null, unit: null, itemQuery: null };

  // ── detect MODE: if money words present → amount mode ──
  const amtWords = ['rupees','taka','rs ','tk ','worth'];
  result.mode = amtWords.some(w=>t.includes(w)) ? 'amount' : 'qty';

  // ── extract number ──
  const numMatch = t.match(/(\d+(\.\d+)?)/);
  if(numMatch) result.number = parseFloat(numMatch[1]);

  // ── extract unit (only relevant in qty mode) ──
  const unitPatterns = [
    [/\bkg\b/,'kg'],[/\bkilogram/,'kg'],
    [/\bgm\b|\bgram/,'gm'],
    [/\blitre|\bliter/,'litre'],[/\bml\b/,'ml'],
    [/\btray\b/,'tray'],[/\bdozen\b|\bduj\b/,'dozen'],
    [/\bpack\b|\bpacket\b/,'pack'],[/\bpiece\b|\bpiece|\bta\b|\bti\b/,'piece'],
  ];
  for(const [pat,u] of unitPatterns){ if(pat.test(t)){result.unit=u;break;} }

  // ── extract item name: strip numbers, units, money words ──
  let item = t
    .replace(/\d+(\.\d+)?/g,' ')
    .replace(/\b(rupees|taka|rs|tk|worth|kg|kilogram|gm|gram|litre|liter|ml|tray|dozen|duj|pack|packet|piece|ta\b|ti\b)\b/g,' ')
    .replace(/\bof\b|\br\b|\bthe\b|\ba\b|\bsome\b/g,' ')
    .replace(/\s+/g,' ').trim();
  result.itemQuery = item || null;

  return result;
}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('Voice not supported in this browser','error');return;}
  const rec=new SR();
  rec.lang='en-IN'; rec.interimResults=false; rec.maxAlternatives=3;
  const btn=document.getElementById('micBtn');
  const lbl=document.getElementById('micLabel')||{textContent:''};
  btn.classList.add('listening'); btn.textContent='🛑';
  rec.start();

  rec.onresult=function(e){
    // Try all alternatives, pick best
    let best=null, bestScore=0;
    for(let i=0;i<e.results[0].length;i++){
      const alt=e.results[0][i].transcript;
      const cmd=parseVoiceCommand(alt);
      if(cmd.itemQuery){
        const ranked=rankProducts(cmd.itemQuery,0.2);
        if(ranked.length&&ranked[0].score>bestScore){
          bestScore=ranked[0].score;
          best={cmd,ranked};
        }
      }
    }
    // Fallback: use first transcript even without item match
    if(!best){
      const cmd=parseVoiceCommand(e.results[0][0].transcript);
      best={cmd,ranked:[]};
    }

    const {cmd,ranked}=best;
    document.getElementById('heard').textContent='"'+cmd.raw+'"';

    // Auto-set mode
    setMode(cmd.mode, true);

    // Fill values
    if(cmd.mode==='amount'){
      if(cmd.number) document.getElementById('amountInput').value=cmd.number;
    }else{
      if(cmd.number) document.getElementById('qty').value=cmd.number;
      if(cmd.unit)   document.getElementById('unit').value=cmd.unit;
    }

    // Auto-select best item
    if(ranked.length){
      selectedItem=ranked[0].p;
      updateChip();
      document.getElementById('result').innerHTML='';

      // Show auto badge
      const ab=document.getElementById('autoBadge');
      ab.style.display='inline-flex';
      ab.className='auto-badge '+(cmd.mode==='amount'?'amount-mode':'');
      document.getElementById('autoBadgeText').textContent=
        `Auto: ${cmd.mode==='amount'?'Amount':'Qty'} · ${ranked[0].p.name}`;

      // Show voice result panel
      const vr=document.getElementById('voiceResult');
      vr.classList.add('show');
      document.getElementById('vr-item').textContent=ranked[0].p.name;
      document.getElementById('vr-mode').textContent=cmd.mode==='amount'?'By Amount (₹)':'By Quantity';
      const qrow=document.getElementById('vr-qty-row');
      if(cmd.mode==='amount'){
        qrow.querySelector('.vr-label').textContent='Amount';
        qrow.querySelector('.vr-val').textContent='₹'+(cmd.number||'?');
      }else{
        qrow.querySelector('.vr-label').textContent='Quantity';
        qrow.querySelector('.vr-val').textContent=(cmd.number||'?')+' '+(cmd.unit||'');
      }

      // Auto-calculate immediately
      setTimeout(()=>calculate(true),150);
    }else{
      // Couldn't identify item — open manual search
      if(cmd.itemQuery){
        document.getElementById('search').value=cmd.itemQuery;
        _doSearch();
        showToast('Could not auto-detect item — please select manually','info');
      }
      // Show manual section
      manualOpen=true;
      document.getElementById('manualSection').style.display='block';
    }
  };

  rec.onerror=function(e){showToast('Mic error: '+e.error,'error');};
  rec.onend=function(){
    btn.classList.remove('listening');
    btn.textContent='🎤';
  };
}

// ════════════════════════════════════════════
//  UNIT CONVERSION
// ════════════════════════════════════════════
function convert(q,from,to){
  if(from===to) return q;
  const table={
    gm_kg:v=>v/1000, kg_gm:v=>v*1000,
    ml_litre:v=>v/1000, litre_ml:v=>v*1000,
    piece_dozen:v=>v/12, dozen_piece:v=>v*12,
    piece_tray:v=>v/30, tray_piece:v=>v*30,
    tray_dozen:v=>v*2.5, dozen_tray:v=>v/2.5,
  };
  return (table[`${from}_${to}`]||null)?.(q)??null;
}

// ════════════════════════════════════════════
//  CALCULATE
// ════════════════════════════════════════════
function calculate(auto=false){
  if(!selectedItem){showToast('Please select a product first','error');return;}
  const res=document.getElementById('result');

  if(mode==='amount'){
    const amount=parseFloat(document.getElementById('amountInput').value||0);
    if(!amount||amount<=0){if(!auto)showToast('Enter a valid amount','error');return;}
    const qtyCalc=((amount/selectedItem.price)*selectedItem.baseQty);
    const qtyStr = qtyCalc%1===0 ? qtyCalc.toFixed(0) : qtyCalc.toFixed(3);
    res.innerHTML=resultCard(selectedItem.name, `${qtyStr} ${selectedItem.unit}`, `for ₹${amount}`,
      `addBill('${esc(selectedItem.name)}','${qtyStr}','${selectedItem.unit}',${amount},'amount')`);
    return;
  }

  const q=parseFloat(document.getElementById('qty').value||0);
  const u=document.getElementById('unit').value;
  if(!q||q<=0){if(!auto)showToast('Enter a valid quantity','error');return;}

  let cq=q;
  if(u!==selectedItem.unit){
    cq=convert(q,u,selectedItem.unit);
    if(cq===null){
      if(!auto)showToast(`Cannot convert ${u} → ${selectedItem.unit}`,'error');
      return;
    }
  }
  const total=((cq/selectedItem.baseQty)*selectedItem.price).toFixed(2);
  res.innerHTML=resultCard(selectedItem.name, `₹${total}`, `${q} ${u}`,
    `addBill('${esc(selectedItem.name)}',${q},'${u}',${total},'qty')`);
}

function esc(s){return s.replace(/'/g,"\\'");}

function resultCard(name,main,sub,onclick){
  return `<div class="result-card">
    <div class="result-name">${name}</div>
    <div class="result-amount">${main}</div>
    <div class="result-sub">${sub}</div>
    <button class="btn" onclick="${onclick}">+ Add to Bill</button>
  </div>`;
}

// ════════════════════════════════════════════
//  BILL
// ════════════════════════════════════════════
function addBill(item,qty,unit,total,type){
  bill.push({item,qty,unit,total:parseFloat(total),type});
  saveBill(); renderBill();
  document.getElementById('result').innerHTML='';
  document.getElementById('voiceResult').classList.remove('show');
  document.getElementById('autoBadge').style.display='none';
  clearSelected();
  document.getElementById('qty').value='';
  document.getElementById('amountInput').value='';
  document.getElementById('heard').textContent='';
  showToast(`${item} added to bill ✓`);
}

function removeBill(i){
  bill.splice(i,1); saveBill(); renderBill();
}

function renderBill(){
  document.getElementById('billDate').textContent=
    new Date().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  const list=document.getElementById('billList');
  const grandRow=document.getElementById('grandRow');
  const billActions=document.getElementById('billActions');
  const badge=document.getElementById('billBadge');

  if(!bill.length){
    list.innerHTML='<div class="bill-empty">📋 No items yet.<br>Use voice or search to add items.</div>';
    grandRow.style.display='none'; billActions.style.display='none'; badge.style.display='none';
    return;
  }

  let g=0;
  list.innerHTML=bill.map((b,i)=>{
    g+=b.total;
    const qtyLabel=b.type==='amount'?`₹${b.total.toFixed(2)} worth`:`${b.qty} ${b.unit}`;
    return `<div class="bill-item">
      <div style="flex:1;min-width:0">
        <div class="bill-item-name">${b.item}</div>
        <div class="bill-item-qty">${qtyLabel}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="bill-item-price">₹${b.total.toFixed(2)}</div>
        <button class="btn-danger no-print" onclick="removeBill(${i})">✕</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('grand').textContent='₹'+g.toFixed(2);
  grandRow.style.display='block';
  billActions.style.display='flex';
  badge.style.display='inline-block';
  badge.textContent=bill.length;
}

function clearBill(){
  if(!confirm('Clear the entire bill?'))return;
  bill=[]; saveBill(); renderBill(); showToast('Bill cleared');
}

// ════════════════════════════════════════════
buildCatTags();
renderInventory();
renderBill();
// Start with manual section hidden (voice auto-opens it if needed)
document.getElementById('manualSection').style.display='none';
manualOpen=false;

if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
